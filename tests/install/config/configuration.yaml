homeassistant:
  name: Testhaus
  unit_system: metric
  time_zone: Europe/Vienna
  currency: EUR
  country: AT
  language: en

default_config:

logger:
  default: warning
  logs:
    custom_components.plugwhen: debug

# simulated car: odometer, state of charge, plug, wallbox counter
input_number:
  auto_soc:
    name: Auto SoC
    min: 0
    max: 100
    step: 1
    initial: 40
    mode: box

input_boolean:
  soc_ausfall:
    name: Ladestand faellt aus
    initial: false
  auto_angesteckt:
    name: Auto angesteckt
    initial: false

input_datetime:
  abfahrt:
    name: Abfahrt
    has_date: false
    has_time: true
    initial: "07:00:00"

input_text:
  meldung:
    name: Letzte Meldung
    max: 255

counter:
  meldungen:
    name: Meldungen
  meldungen_2:
    name: Meldungen 2

# the warning goes through this script (stands in for a notify service)
script:
  notify_sink:
    alias: Notify sink
    fields:
      title: {}
      message: {}
    sequence:
      - action: counter.increment
        target:
          entity_id: counter.meldungen
      - action: input_text.set_value
        target:
          entity_id: input_text.meldung
        data:
          value: "{{ message | truncate(250) }}"

  notify_sink_2:
    alias: Notify sink 2
    fields:
      title: {}
      message: {}
    sequence:
      - action: counter.increment
        target:
          entity_id: counter.meldungen_2

template:
  - sensor:
      - name: Auto Kilometerstand
        unique_id: auto_km
        unit_of_measurement: km
        device_class: distance
        state_class: total_increasing
        state: "12345"
      - name: Auto Ladestand
        unique_id: auto_ladestand
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        state: "{{ 'unknown' if is_state('input_boolean.soc_ausfall', 'on') else states('input_number.auto_soc') | float(0) }}"
      - name: Netz Zaehler
        unique_id: netz_zaehler
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: "5000"
      - name: Wallbox Zaehler
        unique_id: wb_zaehler
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: "100"
  - binary_sensor:
      - name: Auto Stecker
        unique_id: auto_stecker
        state: "{{ is_state('input_boolean.auto_angesteckt', 'on') }}"
  - sensor:
      - name: Test Last
        unique_id: test_last
        state: "1"
        attributes:
          target_kw: 9.5
          hours: >
            {% set ns = namespace(l=[]) %}
            {% for i in range(0, 30) %}
              {% set t = (now().replace(minute=0, second=0, microsecond=0) + timedelta(hours=i)).isoformat() %}
              {% set ns.l = ns.l + [{'t': t, 'typical': 0.4, 'high': 1.0}] %}
            {% endfor %}
            {{ ns.l }}
      - name: Test Verfuegbar
        unique_id: test_avail
        state: "1"
        attributes:
          schema: 1
          valid_until: "{{ (now() + timedelta(hours=6)).isoformat() }}"
          forecast: >
            {% set s = now().replace(minute=0, second=0, microsecond=0) + timedelta(hours=2) %}
            {{ [{'start': s.isoformat(), 'end': (s + timedelta(hours=3)).isoformat(), 'kw': 5.0}] }}
